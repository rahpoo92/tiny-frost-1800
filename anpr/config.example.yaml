# این فایل را با نام config.yaml کپی کنید و مطابق دوربین و محل نصب خودتان ویرایش کنید.
# cp config.example.yaml config.yaml

cameras:
  # اگر فقط یک دوربین دارید (رایج‌ترین حالت: یک دوربین روی درِ ورودی/پارکینگ)
  # role: toggle یعنی نرم‌افزار خودش تشخیص می‌دهد که این عبور، "ورود" است یا "خروج"
  # (هر بار که یک پلاک دیده می‌شود، جهت آن نسبت به آخرین باری که همان پلاک دیده شده برعکس می‌شود).
  - name: "دوربین درب اصلی"
    source: 0 # 0 یا 1 برای وبکم متصل به همین سیستم، یا آدرس RTSP مثل rtsp://user:pass@192.168.1.10:554/stream1
    role: toggle # toggle | entry | exit
    process_every_n_frames: 2 # از هر چند فریم، یک فریم پردازش شود (برای روان ماندن تصویر)
    detection_width: 960 # عرض فریم هنگام تشخیص پلاک (عدد کوچک‌تر = سریع‌تر ولی دقت کمتر برای پلاک‌های دور)

  # اگر دو دوربین جدا برای ورود و خروج دارید، خط بالا را پاک کنید و این دو خط را از حالت کامنت خارج کنید:
  # - name: "دوربین ورودی"
  #   source: 0
  #   role: entry
  # - name: "دوربین خروجی"
  #   source: 1
  #   role: exit

recognition:
  min_char_confidence: 0.45 # حداقل امتیاز تطبیق برای پذیرفتن هر کاراکتر (۰ تا ۱)
  min_plate_confidence: 0.55 # حداقل میانگین امتیاز کل پلاک برای پذیرفتن آن
  frames_to_confirm: 5 # چند فریم متوالیِ هم‌رای لازم است تا یک پلاک قطعی/ثبت شود
  reading_window_seconds: 2.5 # حداکثر زمان جمع‌آوری فریم‌ها برای یک خوانش
  cooldown_seconds: 45 # بعد از ثبت یک پلاک، تا چند ثانیه همان پلاک دوباره ثبت نشود

paths:
  database: data/anpr.db
  templates_dir: data/templates
  snapshots_dir: data/snapshots
  save_snapshots: true # ذخیره عکس لحظه ورود/خروج به همراه هر رکورد (برای بازبینی دستی)

app:
  window_title: "سامانه پلاک‌خوان هوشمند"
